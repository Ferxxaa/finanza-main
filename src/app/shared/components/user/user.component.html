<!-- this part is hidden for xs screens -->
<div class="collapse navbar-collapse">
    <ul class="nav navbar-nav pull-xs-right">
        <li class="dropdown nav-item">
            <a href="#" class="dropdown-toggle dropdown-toggle-notifications nav-link" id="notifications-dropdown-toggle" data-toggle="dropdown">
                <span class="thumb-sm avatar pull-xs-left">
                    <img class="img-circle" src="http://trazas-nbi.com/Imagenes/TimbreN.jpg" alt="Trazas">
                </span>
                <label ID="lblNombre" class="usuario" Visible="False">{{usuario.nombreUsuario}}</label>
                <b class="caret"></b></a>
            <!-- ready to use notifications dropdown.  inspired by smartadmin template.
         consists of three components:
         notifications, messages, progress. leave or add what's important for you.
         uses Sing's ajax-load plugin for async content loading. See #load-notifications-btn -->
            <div class="dropdown-menu dropdown-menu-right animated fadeInUp" id="notifications-dropdown-menu">
                <section class="card notifications">
                    <header class="card-header">
                        <div class="text-xs-center mb-sm">
                            <strong>Datos de Usuario</strong>
                        </div>
                    </header>
                    <!-- notification list with .thin-scroll which styles scrollbar for webkit -->
                    <div id="notifications-list" class="list-group thin-scroll">
                        <div class="list-group-item">
                            <span class="thumb-sm pull-xs-left mr clearfix">Cargo:
                            </span>
                            <p class="no-margin overflow-hidden">
                                <label ID="lblCargo" Visible="False">  </label>
                            </p>
                        </div>
                        <div class="list-group-item">
                            <span class="thumb-sm pull-xs-left mr clearfix">Fecha:
                            </span>
                            <p class="no-margin overflow-hidden">
                                <label ID="lblFecha" Visible="False">{{date | date:'yyyy-MM-dd'}}</label>
                            </p>
                        </div>
                        <div class="list-group-item">
                            <span class="thumb-sm pull-xs-left mr clearfix">Sponsor:
                            </span>
                            <select ID="drdSponsor" class="usuario" ></select>
                        </div>
                        <footer class="card-footer text-sm">
                            
                            <a class="btn btn-danger" (click)="CerrarSesion()"><i class="fa fa-sign-out"></i> Cerrar Sesión</a>
                        </footer>
                    </div>
                </section>
            </div>
        </li>
    </ul>
</div>
